[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tau2-purple-agent"
version = "1.0.0"
description = "Purple agent for tau2-bench benchmark on AgentBeats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.5",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.18.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
